[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/ingestion",
    "crates/rules_engine",
    "crates/scoring",
    "crates/alerts",
    "crates/audit",
    "crates/ai_advisor",
    "crates/api",
    "crates/storage",
]
exclude = ["contracts/flagged_accounts"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["StellarTrace Contributors"]
repository = "https://github.com/marvs8/stellartrace"
description = "A fraud and anomaly detection triage system for the Stellar ecosystem"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.11"
hex = "0.4"
toml = "0.8"

stellartrace-common = { path = "crates/common" }
stellartrace-ingestion = { path = "crates/ingestion" }
stellartrace-rules-engine = { path = "crates/rules_engine" }
stellartrace-scoring = { path = "crates/scoring" }
stellartrace-alerts = { path = "crates/alerts" }
stellartrace-audit = { path = "crates/audit" }
stellartrace-ai-advisor = { path = "crates/ai_advisor" }
stellartrace-storage = { path = "crates/storage" }
