[package]
name = "stellartrace-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "stellartrace-api"
path = "src/main.rs"

[dependencies]
stellartrace-common.workspace = true
stellartrace-ingestion.workspace = true
stellartrace-rules-engine.workspace = true
stellartrace-scoring.workspace = true
stellartrace-alerts.workspace = true
stellartrace-audit.workspace = true
stellartrace-ai-advisor.workspace = true
stellartrace-storage.workspace = true

serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

axum = { version = "0.7", features = ["json"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
